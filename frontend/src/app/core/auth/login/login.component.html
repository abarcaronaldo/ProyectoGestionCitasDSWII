<div class="publica-split">
  <div class="publica-imagen"></div>

  <div class="publica-card-wrap">
    <div class="card card-publica">
      <h2>Iniciar sesión</h2>

      @if (sesionExpirada) {
        <p class="aviso">Tu sesión expiró. Por seguridad, vuelve a iniciar sesión.</p>
      }

      <form (ngSubmit)="enviar()">
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" [(ngModel)]="email" required />
        </div>
        <div>
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" name="password" [(ngModel)]="password" required />
        </div>
        <button type="submit" [disabled]="enviando">{{ enviando ? 'Entrando…' : 'Entrar' }}</button>
      </form>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <p class="texto-ayuda">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </div>
  </div>
</div>
