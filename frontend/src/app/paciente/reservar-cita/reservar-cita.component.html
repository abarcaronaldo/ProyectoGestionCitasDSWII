<h2>Reservar cita</h2>

<div class="card card-estrecho">
  @if (exito) {
    <p>Cita reservada. Redirigiendo a "mis citas"...</p>
  } @else {
    @if (cargando) {
      <p>Cargando...</p>
    } @else {
      <form (ngSubmit)="enviar()">
        <div>
          <label>Especialidad</label>
          <select name="especialidadId" [(ngModel)]="especialidadId" required>
            <option [ngValue]="null" disabled>Selecciona una especialidad</option>
            @for (e of especialidades; track e.id) {
              <option [ngValue]="e.id">{{ e.nombre }}</option>
            }
          </select>
        </div>
        <div>
          <label>Médico</label>
          <select name="medicoId" [(ngModel)]="medicoId" required>
            <option [ngValue]="null" disabled>Selecciona un médico</option>
            @for (m of medicos; track m.id) {
              <option [ngValue]="m.id">{{ m.nombres }} {{ m.apellidos }} ({{ m.especialidadNombre }})</option>
            }
          </select>
        </div>
        <div>
          <label>Fecha y hora</label>
          <input type="datetime-local" name="fecha" [(ngModel)]="fecha" required />
        </div>
        <div>
          <label>Motivo</label>
          <input type="text" name="motivo" [(ngModel)]="motivo" />
        </div>
        <button type="submit" class="btn-verde">Reservar</button>
      </form>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  }
</div>

<p><a routerLink="/paciente/mis-citas">Volver a mis citas</a></p>
