<h2>Reservar cita</h2>

<div class="card card-estrecho">
  @if (exito) {
    <p>Cita reservada. Redirigiendo a "mis citas"...</p>
  } @else {
    @if (cargando) {
      <p class="cargando"><span class="spinner"></span> Cargando…</p>
    } @else {
      <form (ngSubmit)="enviar()">
        <div>
          <label for="res-especialidad">Especialidad</label>
          <select id="res-especialidad" name="especialidadId" [(ngModel)]="especialidadId" (ngModelChange)="onEspecialidadCambio()" required>
            <option [ngValue]="null" disabled>Selecciona una especialidad</option>
            @for (e of especialidades; track e.id) {
              <option [ngValue]="e.id">{{ e.nombre }}</option>
            }
          </select>
        </div>
        <div>
          <label for="res-medico">Médico</label>
          <select id="res-medico" name="medicoId" [(ngModel)]="medicoId" required [disabled]="especialidadId === null">
            <option [ngValue]="null" disabled>
              {{ especialidadId === null ? 'Primero selecciona una especialidad' : 'Selecciona un médico' }}
            </option>
            @for (m of medicosFiltrados; track m.id) {
              <option [ngValue]="m.id">{{ m.nombres }} {{ m.apellidos }}</option>
            }
          </select>
          @if (especialidadId !== null && medicosFiltrados.length === 0) {
            <small>No hay médicos disponibles para esta especialidad.</small>
          }
        </div>
        <div>
          <label for="res-fecha">Fecha y hora</label>
          <input id="res-fecha" type="datetime-local" name="fecha" [(ngModel)]="fecha" required />
        </div>
        <div>
          <label for="res-motivo">Motivo</label>
          <input id="res-motivo" type="text" name="motivo" [(ngModel)]="motivo" placeholder="Ej: Dolor de muela (opcional)" />
        </div>
        <button type="submit" class="btn-verde" [disabled]="enviando">{{ enviando ? 'Reservando…' : 'Reservar' }}</button>
      </form>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  }
</div>

<p><a routerLink="/paciente/mis-citas">Volver a mis citas</a></p>
