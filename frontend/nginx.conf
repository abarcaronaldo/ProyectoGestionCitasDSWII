server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Reenvía las llamadas al backend hacia el api-gateway (misma red de Docker).
    # Así el frontend y la API quedan en el MISMO origen: no hay CORS y basta
    # con exponer un solo puerto (clave para compartir con ngrok).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El gateway solo permite el origen localhost:4200 en su CORS; al forzarlo
        # aquí, el backend acepta la petición venga de donde venga la URL pública.
        proxy_set_header Origin http://localhost:4200;
    }

    # Angular es una SPA: cualquier ruta desconocida cae en index.html
    # (si no, recargar una ruta como /citas daría 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
