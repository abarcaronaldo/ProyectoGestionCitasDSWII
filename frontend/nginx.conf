server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular es una SPA: cualquier ruta desconocida cae en index.html
    # (si no, recargar una ruta como /citas daría 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
