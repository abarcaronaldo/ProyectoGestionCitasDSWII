name: gestioncitas

networks:
  gestioncitas-net:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - gestioncitas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gestioncitas-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - gestioncitas-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-4f8c2e9a7b1d63f05a9e8c47d2b1f6a3e90c75d84b2a1f63e8d70c95a4b3f12e6}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    networks:
      - gestioncitas-net
    depends_on:
      eureka-server:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - gestioncitas-net
    depends_on:
      - api-gateway

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-4f8c2e9a7b1d63f05a9e8c47d2b1f6a3e90c75d84b2a1f63e8d70c95a4b3f12e6}
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  paciente-service:
    build:
      context: .
      dockerfile: paciente-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  doctor-service:
    build:
      context: .
      dockerfile: doctor-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  citas-service:
    build:
      context: .
      dockerfile: citas-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  historial-medico-service:
    build:
      context: .
      dockerfile: historial-medico-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  reporte-service:
    build:
      context: .
      dockerfile: reporte-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - gestioncitas-net
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
