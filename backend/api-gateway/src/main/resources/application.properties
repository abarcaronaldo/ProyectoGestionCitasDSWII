# Configuración del Servidor
server.port=8080

# Configuración de Spring
spring.application.name=api-gateway

# Configuración de Seguridad (JWT)
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-do-not-use-in-prod}

# Configuración de CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Configuración de Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Configuración de Actuator y Monitoreo (Management)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
